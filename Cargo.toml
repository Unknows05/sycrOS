[package]
name = "sycros"
version = "0.2.0"
edition = "2021"
description = "sycrOS - one USB stick for Windows, Linux and macOS installers"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[[bin]]
name = "sycros"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
lzma-rs = "0.3"
flate2 = "1.1"
bzip2-rs = "0.1"
lzfse_rust = "0.2"
plist = "1.10"
sha2 = "0.11"
tar = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
getrandom = "0.2"
dialoguer = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
