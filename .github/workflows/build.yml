name: Build sycros

# Every push: check + test + build packages (download them under "Artifacts").
# Push a tag like v0.2.1: the same packages are also published as a GitHub Release.
# File names never contain the version, so
#   https://github.com/Unknows05/sycrOS/releases/latest/download/<file>
# always gives the newest one (README and install scripts rely on this).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gdisk
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # static program (musl): runs on any 64-bit Linux
      - run: packaging/linux/build-deb.sh
      - name: Check the program is self-contained and runs
        run: |
          B=target/x86_64-unknown-linux-musl/release/sycros
          file $B | grep -q 'static' || { echo "not a static program"; exit 1; }
          $B --version
          $B disks
      - run: |
          mkdir -p pkg/sycros && cp target/x86_64-unknown-linux-musl/release/sycros README.md pkg/sycros/
          tar -C pkg -czf dist/sycros-linux-amd64.tar.gz sycros
          cp target/x86_64-unknown-linux-musl/release/sycros dist/sycros-linux-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: sycros-linux
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # .cargo/config.toml builds the C runtime into sycros.exe
      - run: cargo build --release
      - name: Check sycros.exe needs no extra runtime, and runs on Windows
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $deps = & $dumpbin /dependents target\release\sycros.exe | Out-String
          Write-Output $deps
          if ($deps -match 'VCRUNTIME') { throw "sycros.exe still needs VCRUNTIME140.dll" }
          target\release\sycros.exe --version
          target\release\sycros.exe disks
      - name: Real Windows test - the app and menu in a real console
        run: cargo test --release --test menu_pty --test tui_pty --test update
      - name: Real Windows test - write to a virtual disk like a USB stick
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $B = "$PWD\target\release\sycros.exe"
          Set-Location $env:RUNNER_TEMP
          $vhd = "$env:RUNNER_TEMP\stick.vhd"
          "create vdisk file=`"$vhd`" maximum=1024 type=expandable`nattach vdisk" | Set-Content dp.txt
          diskpart /s dp.txt
          $n = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          Write-Output "virtual stick is disk $n"

          # small test volume: real HFS+ header at the start, backup header at the end
          $vol = [byte[]]::new(40MB)
          $h = [byte[]]::new(512)
          $h[0] = 0x48; $h[1] = 0x2B; $h[3] = 4
          $h[42] = 0x10                       # block size 4096
          $h[46] = 0x28                       # 10240 blocks
          [Array]::Copy($h, 0, $vol, 1024, 512)
          [Array]::Copy($h, 0, $vol, $vol.Length - 1024, 512)
          [IO.File]::WriteAllBytes("$PWD\Install macOS Test.iso", $vol)
          [IO.File]::WriteAllBytes("$PWD\ubuntu-test.iso", [byte[]]::new(1MB))

          & $B init $n --mac-space 200M --internal --yes
          & $B add $n "Install macOS Test.iso" ubuntu-test.iso --internal
          & $B status $n --files | Tee-Object status.txt
          if (-not (Select-String -Quiet 'Install macOS Test' status.txt)) { throw 'macOS section missing' }
          if (-not (Select-String -Quiet 'ubuntu-test.iso' status.txt)) { throw 'ISO missing' }
          & $B remove $n --slot 3 --internal
          & $B status $n | Tee-Object status2.txt
          if (Select-String -Quiet 'Install macOS Test' status2.txt) { throw 'macOS section not removed' }
          & $B eject $n --internal
          Get-Partition -DiskNumber $n | Format-Table PartitionNumber, Size, Type, DriveLetter
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/sycrOS, dist | Out-Null
          Copy-Item target/release/sycros.exe, README.md, packaging/windows/Start-sycrOS.cmd pkg/sycrOS/
          Compress-Archive -Path pkg/sycrOS -DestinationPath dist/sycros-windows-x64.zip
          Copy-Item target/release/sycros.exe dist/sycros-windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: sycros-windows
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest   # Apple silicon machine
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, name: apple-silicon, run: true }
          - { target: x86_64-apple-darwin, name: intel, run: false }
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Real macOS test - the app and menu in a real terminal
        if: matrix.run
        run: cargo test --release --test menu_pty --test tui_pty --test update
      - name: Sign (ad-hoc) and check the program
        run: |
          B=target/${{ matrix.target }}/release/sycros
          codesign --force --sign - $B
          codesign --verify --verbose $B
          vtool -show-build $B
      - name: Real macOS test - build a stick image and add a real Apple DMG
        if: matrix.run
        run: |
          B=$PWD/target/${{ matrix.target }}/release/sycros
          $B --version
          $B disks
          cd "$RUNNER_TEMP"
          # real installer-like volumes made by Apple's own tool, then zlib + LZFSE compressed.
          # hdiutil is flaky on CI machines: retry a few times.
          mk() { for i in 1 2 3 4 5; do "$@" && return 0; echo "hdiutil failed, retry $i"; sleep 5; done; return 1; }
          mk hdiutil create -size 60m -fs HFS+ -volname "Install macOS Test" -ov raw1.dmg
          mk hdiutil create -size 40m -fs HFS+ -volname "macOS Base System" -ov raw2.dmg
          mk hdiutil convert raw1.dmg -format UDZO -ov -o zlib.dmg
          mk hdiutil convert raw2.dmg -format ULFO -ov -o lzfse.dmg
          ls -la *.dmg
          $B inspect zlib.dmg lzfse.dmg
          $B init stick.img --size 1G --mac-space 200M --yes
          $B add stick.img zlib.dmg lzfse.dmg
          $B status stick.img
          $B status stick.img | grep -q "Install macOS Test"
          $B status stick.img | grep -q "macOS Base System"
      - run: |
          mkdir -p pkg/sycrOS dist
          cp target/${{ matrix.target }}/release/sycros README.md packaging/macos/Start-sycrOS.command pkg/sycrOS/
          cp pkg/sycrOS/sycros dist/sycros-macos-${{ matrix.name }}
          cd pkg && zip -qr ../dist/sycros-macos-${{ matrix.name }}.zip sycrOS
      - uses: actions/upload-artifact@v7
        with:
          name: sycros-macos-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cp install.sh install.ps1 dist/
      # the checksum list `sycros update` checks its downloads against
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  # After a release: install it the way a user would, on fresh machines.
  try-installers:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: |
          sh install.sh
          sycros --version
          sycros disks
          sycros update
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\sycrOS\sycros.exe" --version
          & "$env:LOCALAPPDATA\sycrOS\sycros.exe" disks
          & "$env:LOCALAPPDATA\sycrOS\sycros.exe" update
