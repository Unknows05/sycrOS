# Windows: build the C runtime into sycros.exe, so it runs on PCs
# without the "Visual C++ Redistributable" (no VCRUNTIME140.dll needed).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
